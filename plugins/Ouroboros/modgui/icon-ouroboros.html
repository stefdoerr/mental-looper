<!--
  Ouroboros — MOD pedalboard icon template.

  Mustache tokens ({{brand}}, {{label}}, {{color}}) are substituted by
  MOD-UI at render time using the values from modgui.ttl. Every
  mod-port-symbol below must exist in modgui.ttl AND in the plugin's
  generated TTL (initParameter()). The momentary stop_clear port is
  footswitch-only and deliberately has no button here.

  Required structural elements: drag-handle, bypass-light, bypass
  footswitch, and the audio I/O loops.
-->
<div class="mod-pedal ouroboros-pedal mod-pedal-ouroboros mod-{{color}} {{color}}">

    <div mod-role="drag-handle" class="mod-drag-handle"></div>

    <div class="mod-plugin-brand"><h1>{{brand}}</h1></div>
    <div class="mod-plugin-name"><h1>{{label}}</h1></div>

    <!-- Bypass light + footswitch (required by MOD pedalboard) -->
    <div class="mod-light on" mod-role="bypass-light"></div>
    <div class="mod-footswitch" mod-role="bypass"></div>

    <div class="ouroboros-controls">
        <div class="mod-knob ouroboros-knob">
            <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="track"></div>
            <span class="mod-knob-title">TRACK</span>
        </div>
        <div class="mod-knob ouroboros-knob">
            <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="volume"></div>
            <span class="mod-knob-title">VOLUME</span>
        </div>
    </div>

    <!-- Trigger buttons: script-ouroboros.js writes 1 on press, 0 on release. -->
    <div class="ouroboros-keys">
        <button type="button" class="ouroboros-key ouroboros-key-main" data-port="rec" title="Rec / Play / Dub on the selected track">REC</button>
        <button type="button" class="ouroboros-key" data-port="stop_play" title="Stop all tracks, or start them again from the top">STOP/<wbr>PLAY</button>
        <button type="button" class="ouroboros-key" data-port="undo" title="Undo the newest layer of the selected track">UNDO</button>
        <button type="button" class="ouroboros-key" data-port="redo" title="Redo the layer you just undid">REDO</button>
        <button type="button" class="ouroboros-key" data-port="onoff" title="Switch the selected track on or off">ON/OFF</button>
        <button type="button" class="ouroboros-key" data-port="clear_track" title="Clear the selected track">CLEAR</button>
        <button type="button" class="ouroboros-key" data-port="clear_all" title="Clear all four tracks">CLEAR ALL</button>
    </div>

    <!-- Audio I/O — required structure for pedalboard connections. -->
    <div class="mod-pedal-input">
        {{#effect.ports.audio.input}}
        <div class="mod-input mod-input-disconnected" title="{{name}}"
             mod-role="input-audio-port" mod-port-symbol="{{symbol}}">
            <div class="mod-pedal-input-image"></div>
        </div>
        {{/effect.ports.audio.input}}
    </div>
    <div class="mod-pedal-output">
        {{#effect.ports.audio.output}}
        <div class="mod-output mod-output-disconnected" title="{{name}}"
             mod-role="output-audio-port" mod-port-symbol="{{symbol}}">
            <div class="mod-pedal-output-image"></div>
        </div>
        {{/effect.ports.audio.output}}
    </div>

</div>
