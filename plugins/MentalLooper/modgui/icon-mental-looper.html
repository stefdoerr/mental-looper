<!--
  Mental Looper face.
  Design: docs/superpowers/specs/2026-11-25-mental-looper-face-design.md; the mockup next to it is the reference for
  every pixel value.

  - Every selector in the stylesheet carries {{{cns}}}, and the root here does too, so a stable and a beta copy on one
    page can't restyle each other. No id= attributes: two pedals on a page would share them.
  - The head between the ml-head markers is baked by generate_face.py (make face-assets): don't edit it by hand.
  - script-mental-looper.js sets the state classes (ml-st-0..5 from the looper output, ml-off when bypassed, ml-rec-on)
    and writes the ports. The markup below is the pose before it runs: nothing recorded, track 1, part A, 0 dB, the
    default song.
  - The beta build's Makefile adds BETA to the fine print.
-->
<div class="mod-pedal ml-pedal{{{cns}}} mod-no-shadow ml-st-0">

    <div mod-role="drag-handle" class="mod-drag-handle"></div>

    <div class="ml-brand">STEFAN</div>
    <div class="ml-fine">ML-4<br>4 TRACKS</div>
    <img class="ml-title" src="/resources/face/title.svg{{{ns}}}" alt="Mental Looper" draggable="false">

    <!-- On/off: the badge IS the bypass light (mod-ui sets .on / .off, also for a footswitch, MIDI or the HMI); the
         footswitch is a transparent hit area on top of it. -->
    <div class="mod-light on" mod-role="bypass-light">
        <svg class="ml-badge" viewBox="-24 -24 48 48" aria-hidden="true"><g transform="rotate(-8)">
            <circle class="ml-badge-disc" r="20"/>
            <text class="ml-badge-on" y="6">ON</text>
            <text class="ml-badge-off" y="5">OFF</text>
            <path class="ml-badge-shine" d="M-15.5,-5A16.5,16.5 0 0 1 -6,-15.5"/>
        </g></svg>
    </div>
    <div class="mod-footswitch" mod-role="bypass" title="On/Off"></div>

    <!-- ml-head:end -->
    <button type="button" class="ml-rec" title="REC: click the mouth" aria-label="Record"></button>

    <button type="button" class="ml-trk ml-t1 sel" data-track="1" title="Track 1">1</button>
    <button type="button" class="ml-trk ml-t2" data-track="2" title="Track 2">2</button>
    <button type="button" class="ml-trk ml-t3" data-track="3" title="Track 3">3</button>
    <button type="button" class="ml-trk ml-t4" data-track="4" title="Track 4">4</button>

    <div class="ml-part">
        <div class="ml-cap">PART</div>
        <div class="ml-parts">
            <button type="button" class="ml-pt sel" data-part="0">A</button>
            <button type="button" class="ml-pt" data-part="1">B</button>
            <button type="button" class="ml-pt" data-part="2">C</button>
            <button type="button" class="ml-pt" data-part="3">D</button>
        </div>
        <button type="button" class="ml-key ml-song" title="Play the song steps"><i></i>SONG</button>
    </div>

    <div class="ml-trackbox">
        <div class="ml-cap">TRACK <span class="ml-tn">1</span></div>
        <!-- The knob is drawn from --v (0..1, set by the script from the volume port; inline: the 0 dB default). The
             transparent mod-knob-image on top is what mod-ui's film widget drags. -->
        <div class="mod-knob ml-knob" style="--v:0.9091">
            <svg class="ml-ticks" viewBox="-40 -40 80 80" aria-hidden="true"><line x1="-21.9" y1="21.9" x2="-25.1" y2="25.1"/><line x1="-29.5" y1="9.6" x2="-32.3" y2="10.5"/><line x1="-30.6" y1="-4.8" x2="-33.6" y2="-5.3"/><line x1="-25.1" y1="-18.2" x2="-27.5" y2="-20.0"/><line x1="-14.1" y1="-27.6" x2="-15.4" y2="-30.3"/><line x1="0.0" y1="-31.0" x2="0.0" y2="-35.5"/><line x1="14.1" y1="-27.6" x2="15.4" y2="-30.3"/><line x1="25.1" y1="-18.2" x2="27.5" y2="-20.0"/><line x1="30.6" y1="-4.8" x2="33.6" y2="-5.3"/><line x1="29.5" y1="9.6" x2="32.3" y2="10.5"/><line x1="21.9" y1="21.9" x2="25.1" y2="25.1"/></svg>
            <div class="ml-kcap"><i></i></div>
            <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="volume"></div>
        </div>
        <div class="ml-klab">VOLUME<span class="ml-db">0.0 dB</span></div>
        <button type="button" class="ml-key ml-onoff" data-port="onoff" title="Switch the selected track on or off">ON/OFF</button>
    </div>

    <div class="ml-keys">
        <button type="button" class="ml-key" data-port="stop_play" title="Stop all tracks, or start them again from the top">STOP/PLAY</button>
        <button type="button" class="ml-key" data-port="undo" title="Undo the newest layer of the selected track">UNDO</button>
        <button type="button" class="ml-key" data-port="redo" title="Redo the layer you just undid">REDO</button>
        <button type="button" class="ml-key" data-port="clear_track" title="Clear the selected track">CLEAR</button>
        <button type="button" class="ml-key" data-port="clear_all" title="Clear all four tracks">CLEAR ALL</button>
    </div>

    <div class="ml-prog" style="--p:0"><i class="ml-prog-fill"></i><span class="ml-prog-ticks"></span><span class="ml-prog-time">0:00</span></div>

    <div class="ml-strip">
        <div class="ml-rule"></div>
        <div class="ml-scap">SONG STEPS</div>
        <div class="ml-hint">CLICK: PART · SCROLL: REPEATS</div>
        <div class="ml-steps">
            <button type="button" class="ml-step" data-step="1" aria-label="Step 1"><b>A</b><small>×1</small></button>
            <button type="button" class="ml-step end" data-step="2" aria-label="Step 2"><b>↺</b><small></small></button>
            <button type="button" class="ml-step end dead" data-step="3" aria-label="Step 3"><b>↺</b><small></small></button>
            <button type="button" class="ml-step end dead" data-step="4" aria-label="Step 4"><b>↺</b><small></small></button>
            <button type="button" class="ml-step end dead" data-step="5" aria-label="Step 5"><b>↺</b><small></small></button>
            <button type="button" class="ml-step end dead" data-step="6" aria-label="Step 6"><b>↺</b><small></small></button>
            <button type="button" class="ml-step end dead" data-step="7" aria-label="Step 7"><b>↺</b><small></small></button>
            <button type="button" class="ml-step end dead" data-step="8" aria-label="Step 8"><b>↺</b><small></small></button>
            <button type="button" class="ml-step end dead" data-step="9" aria-label="Step 9"><b>↺</b><small></small></button>
            <button type="button" class="ml-step end dead" data-step="10" aria-label="Step 10"><b>↺</b><small></small></button>
            <button type="button" class="ml-step end dead" data-step="11" aria-label="Step 11"><b>↺</b><small></small></button>
            <button type="button" class="ml-step end dead" data-step="12" aria-label="Step 12"><b>↺</b><small></small></button>
            <button type="button" class="ml-step end dead" data-step="13" aria-label="Step 13"><b>↺</b><small></small></button>
            <button type="button" class="ml-step end dead" data-step="14" aria-label="Step 14"><b>↺</b><small></small></button>
            <button type="button" class="ml-step end dead" data-step="15" aria-label="Step 15"><b>↺</b><small></small></button>
            <button type="button" class="ml-step end dead" data-step="16" aria-label="Step 16"><b>↺</b><small></small></button>
        </div>
    </div>

    <!-- Audio I/O: required structure for pedalboard connections. -->
    <div class="mod-pedal-input">
        {{#effect.ports.audio.input}}
        <div class="mod-input mod-input-disconnected" title="{{name}}"
             mod-role="input-audio-port" mod-port-symbol="{{symbol}}">
            <div class="mod-pedal-input-image"></div>
        </div>
        {{/effect.ports.audio.input}}
    </div>
    <div class="mod-pedal-output">
        {{#effect.ports.audio.output}}
        <div class="mod-output mod-output-disconnected" title="{{name}}"
             mod-role="output-audio-port" mod-port-symbol="{{symbol}}">
            <div class="mod-pedal-output-image"></div>
        </div>
        {{/effect.ports.audio.output}}
    </div>

</div>
